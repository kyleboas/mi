# Rendered by scripts/install-mi-subscription-gateway-root.sh after path and account checks.
[Service]
User=@SERVICE_USER@
Group=@SERVICE_GROUP@
Environment=HOME=@SERVICE_HOME@
Environment=MI_GATEWAY_SERVICE_HOME=@SERVICE_HOME@
Environment=MI_GATEWAY_PI_BINARY=@PI_BINARY@
Environment=MI_GATEWAY_PI_COMMAND_DIR=@PI_COMMAND_DIR@
Environment=MI_GATEWAY_PI_AGENT_DIR=@PI_AGENT_DIR@
Environment=MI_GATEWAY_WORK_DIR=@WORK_DIR@
LoadCredential=
LoadCredential=gateway:/etc/agent-secrets/local-agent-gateway.token
ProtectHome=read-only
ReadWritePaths=@PI_AGENT_DIR@ @WORK_DIR@
